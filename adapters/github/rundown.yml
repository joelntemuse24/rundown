# Copy to .github/workflows/rundown.yml.
# Posts the PR URL to your Rundown server and writes the replay URL into the job summary.
# It does not review and does not comment, unless the repository variable RUNDOWN_COMMENT is "1".
#
# Repository settings:
#   variables.RUNDOWN_URL      https://<host>  (required)
#   secrets.RUNDOWN_TOKEN      bearer token, if the server sets one
#   variables.RUNDOWN_COMMENT  "1" for one sticky comment with the link (off by default)

name: Rundown

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Write the replay
        id: rundown
        env:
          RUNDOWN_URL: ${{ vars.RUNDOWN_URL }}
          RUNDOWN_TOKEN: ${{ secrets.RUNDOWN_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ -z "$RUNDOWN_URL" ]; then
            echo "Set the RUNDOWN_URL repository variable to your Rundown server." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          body=$(jq -n --arg pr "$PR_URL" '{pr_url: $pr, wait: true}')
          out=$(curl -sS -X POST "$RUNDOWN_URL/generate" \
            -H 'content-type: application/json' \
            ${RUNDOWN_TOKEN:+-H "authorization: Bearer $RUNDOWN_TOKEN"} \
            --data "$body" --max-time 300 || true)
          url=$(printf '%s' "$out" | jq -r '.url // empty' 2>/dev/null || true)
          status=$(printf '%s' "$out" | jq -r '.status // empty' 2>/dev/null || true)
          if [ -z "$url" ] || [ "$status" = "failed" ]; then
            err=$(printf '%s' "$out" | jq -r '.error // empty' 2>/dev/null || true)
            echo "Rundown could not write a replay: ${err:-no response from $RUNDOWN_URL}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Rundown replay"
            echo
            echo "$url"
            echo
            printf '%s' "$out" | jq -r '.text' | sed 's/^/> /'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Sticky comment (opt-in)
        if: vars.RUNDOWN_COMMENT == '1' && steps.rundown.outputs.url != ''
        uses: actions/github-script@v7
        env:
          REPLAY_URL: ${{ steps.rundown.outputs.url }}
        with:
          script: |
            const marker = '<!-- rundown-replay -->';
            const body = `${marker}\nRundown replay: ${process.env.REPLAY_URL}`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
